name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: gitleaks_8.30.1_linux_x64.tar.gz
            sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          - os: macos-latest
            asset: gitleaks_8.30.1_darwin_arm64.tar.gz
            sha256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned gitleaks (checksum verified)
        env:
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --max-time 120 -o "$ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$ASSET"
          echo "$SHA256  $ASSET" | shasum -a 256 -c -
          tar -xzf "$ASSET" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          gitleaks version
          bash tests/run-tests.sh
